name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: CPU tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out ComfyUI v0.38.0
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Comfy-Org/ComfyUI
          ref: 6b747c0428c343e1417219641db93a4fb7cb69ae # v0.38.0
          path: _comfyui
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install CPU PyTorch, ComfyUI requirements and test tools
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch==2.14.1 torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r _comfyui/requirements.txt
          python -m pip install pytest==9.1.1 ruff==0.16.10

      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Tests (no GPU, no weights; a fake runtime stands in for the upstream pipeline)
        shell: bash
        env:
          COMFYUI_PATH: ${{ github.workspace }}/_comfyui
        run: python -m pytest -q -rs --ignore=_comfyui
